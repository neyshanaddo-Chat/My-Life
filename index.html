<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>My App</title>
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="My App">
  <style>
    html, body { margin: 0; height: 100%; background: #fff; }
    body { font-family: system-ui, -apple-system, sans-serif; color: #111; }
    #app { min-height: 100%; }
  </style>
</head>
<body>
  <!-- Blank canvas. Tools get added inside #app. -->
  <div id="app"></div>

  <script>
    // ---- Auto-update: when a new version is published, the app reloads itself quietly ----
    const VERSION_URL = 'version.json';
    let current = null;

    async function checkForUpdate() {
      try {
        const res = await fetch(VERSION_URL + '?t=' + Date.now(), { cache: 'no-store' });
        if (!res.ok) return;
        const { version } = await res.json();
        if (current === null) { current = version; return; }
        if (version !== current) {
          const reg = await navigator.serviceWorker?.getRegistration();
          if (reg) await reg.update();
          location.reload();
        }
      } catch (_) { /* offline: keep running the downloaded copy */ }
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
      let reloaded = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (!reloaded) { reloaded = true; location.reload(); }
      });
    }

    checkForUpdate();
    setInterval(() => { if (!document.hidden) checkForUpdate(); }, 5000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) checkForUpdate(); });
    window.addEventListener('focus', checkForUpdate);
  </script>
</body>
</html>
